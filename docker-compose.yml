# Postgres de desenvolvimento. Subir: docker compose up -d
# Porta 5433 para não conflitar com um Postgres já instalado na máquina (5432).
# Senha só para uso local; em produção use credenciais próprias.
services:
  postgres:
    image: postgres:18-alpine
    container_name: app-debora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: app_debora
      POSTGRES_PASSWORD: app_debora_dev
      POSTGRES_DB: app_debora
      TZ: America/Sao_Paulo
    ports:
      - "5433:5432"
    volumes:
      - postgres-dados:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_debora -d app_debora"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-dados:
