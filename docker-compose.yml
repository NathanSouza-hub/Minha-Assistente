# Postgres de desenvolvimento. Subir: docker compose up -d
# Porta 5433 para não conflitar com um Postgres já instalado na máquina (5432).
# Senha só para uso local; em produção use credenciais próprias.
services:
  postgres:
    image: postgres:18-alpine
    container_name: minha-assistente-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: minha_assistente
      POSTGRES_PASSWORD: minha_assistente_dev
      POSTGRES_DB: minha_assistente
      TZ: America/Sao_Paulo
    ports:
      - "5433:5432"
    volumes:
      - postgres-dados:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minha_assistente -d minha_assistente"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-dados:
