# Produção num servidor só (VPS): Postgres + API (com o agendador de lembretes) + Caddy (HTTPS e
# front). Os valores vêm do .env do servidor (modelo: .env.producao.example). Guia: docs/deploy.md.
#   docker compose -f docker-compose.prod.yml up -d --build
# Servidor que já tem um proxy HTTPS nas portas 80/443: acrescente docker-compose.proxy.yml.
name: minha-assistente

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: minha_assistente
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: minha_assistente
      TZ: America/Sao_Paulo
    volumes:
      - postgres-dados:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minha_assistente -d minha_assistente"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Sem "ports": o banco só é visível para a API, dentro da rede do compose.

  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://minha_assistente:${POSTGRES_PASSWORD}@postgres:5432/minha_assistente
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30d}
      # Front e API no mesmo domínio: o navegador não precisa de CORS.
      CORS_ORIGINS: ""
      UPLOADS_DIR: /app/uploads
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # WhatsApp (API oficial da Meta). Vazios = desligado. Passo a passo em docs/deploy.md.
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_NUMERO_ID: ${WHATSAPP_NUMERO_ID:-}
      WHATSAPP_NUMERO: ${WHATSAPP_NUMERO:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_MODELO: ${WHATSAPP_MODELO:-lembrete}
      WHATSAPP_MODELO_IDIOMA: ${WHATSAPP_MODELO_IDIOMA:-pt_BR}
      # Contas novas só pelo comando do administrador (docs/deploy.md). "true" reabre o cadastro.
      CADASTRO_ABERTO: ${CADASTRO_ABERTO:-false}
    volumes:
      - anexos:/app/uploads

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE: ${DOMINIO:?defina DOMINIO no .env}
      EMAIL_CERTIFICADO: ${EMAIL_CERTIFICADO:?defina EMAIL_CERTIFICADO no .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-dados:/data
      - caddy-config:/config

volumes:
  postgres-dados:
  anexos:
  caddy-dados:
  caddy-config:
